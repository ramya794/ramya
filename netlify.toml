[build]
  publish = "."

[[redirects]]
  from = "/index (1).html"
  to = "/"
  status = 301

[[redirects]]
  from = "/index%20(1).html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
